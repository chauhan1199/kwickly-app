<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Kwickly – Mobile Prototype v4</title>
<meta name="description" content="Kwickly – Every Service. Anytime. Near You. Interactive mobile prototype."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fb;--surface:#ffffff;--surface-2:#f1f4f8;--text:#0b1422;--muted:#5b6776;--border:#e5eaf0;
  --brand:#0e9aa7;--brand-2:#43e3eb;--accent:#7ed957;--navy:#0f1b3d;
  --warn:#f59e0b;--err:#ef4444;--ok:#10b981;
  --shadow:0 6px 20px rgba(15,27,61,.08);
  --radius:16px;
}
[data-theme="dark"]{
  --bg:#070b14;--surface:#101826;--surface-2:#0a121e;--text:#e8eef7;--muted:#8a99ad;--border:#1c2738;
  --brand:#43e3eb;--brand-2:#7ed957;--navy:#0a1530;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0a121e;color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px 8px 32px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;max-width:760px}
.toolbar button{background:#101826;color:#e8eef7;border:1px solid #1c2738;border-radius:10px;padding:8px 12px;font:600 13px 'Plus Jakarta Sans';cursor:pointer;transition:.15s}
.toolbar button:hover{background:#1c2738}
.toolbar button.active{background:var(--brand);color:#001016;border-color:var(--brand)}
.toolbar .group{display:flex;gap:4px;background:#101826;border:1px solid #1c2738;border-radius:12px;padding:4px}

/* Phone frame */
.phone{width:390px;max-width:96vw;height:844px;max-height:92vh;background:var(--bg);border-radius:42px;border:10px solid #0c1422;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;color:var(--text)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#0c1422;border-radius:0 0 18px 18px;z-index:50}
.statusbar{position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;font-size:12px;font-weight:700;z-index:40;color:var(--text)}
.screen{position:absolute;inset:0;padding:46px 0 90px;overflow-y:auto;background:var(--bg);display:none;flex-direction:column}
.screen.show{display:flex}
.appbar{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;background:var(--bg);position:sticky;top:0;z-index:5}
.appbar h1{font-size:18px;margin:0;font-weight:800}
.appbar .sub{font-size:12px;color:var(--muted);font-weight:500}
.appbar .back{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;font-size:18px;color:var(--text);flex-shrink:0}
.appbar .spacer{flex:1}
.appbar .icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;color:var(--text);position:relative;flex-shrink:0}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--err)}

.body{padding:8px 16px 24px;flex:1}
/* Base tabbar */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:72px;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:6;overflow:visible}
.tabbar button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:600 10px 'Plus Jakarta Sans';cursor:pointer;padding:6px 10px;border-radius:12px;transition:.15s}
.tabbar button.active{color:var(--brand);background:color-mix(in oklab,var(--brand) 12%,transparent)}
.tabbar button svg{width:22px;height:22px}
/* Customer FAB tab bar */
.cust-tabbar{width:100%;height:100%;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;position:relative;overflow:visible}
.cust-tab{background:none;border:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:600 10px 'Plus Jakarta Sans';cursor:pointer;padding:8px 4px;border-radius:12px;transition:.15s;height:100%}
.cust-tab.active{color:var(--brand);background:color-mix(in oklab,var(--brand) 10%,transparent)}
.cust-fab-wrap{flex:0 0 68px;display:flex;justify-content:center;align-items:flex-end;position:relative;height:100%;overflow:visible}
.cust-fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#0e9aa7,#43e3eb);border:4px solid var(--surface);box-shadow:0 -6px 22px rgba(14,154,167,.5),0 4px 16px rgba(14,154,167,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#001016;cursor:pointer;font:800 9px 'Plus Jakarta Sans';gap:1px;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);transition:.2s;z-index:12}
.cust-fab:hover{transform:translateX(-50%) scale(1.08);box-shadow:0 -8px 28px rgba(14,154,167,.7)}
.cust-fab:active{transform:translateX(-50%) scale(.95)}
.cust-fab.active{background:linear-gradient(145deg,#07737e,#1eb8c2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{background:var(--brand);color:#001016;border:none;border-radius:12px;padding:12px 16px;font:700 14px 'Plus Jakarta Sans';cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.outline{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn.danger{background:var(--err);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:8px 12px;font-size:12px;width:auto;border-radius:10px}
.input,.select,textarea.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:500 14px 'Plus Jakarta Sans';color:var(--text);outline:none;transition:.15s}
.input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in oklab,var(--brand) 15%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font:600 12px 'Plus Jakarta Sans';color:var(--text);cursor:pointer;transition:.15s}
.chip:hover{background:var(--surface)}
.chip.brand{background:color-mix(in oklab,var(--brand) 14%,transparent);border-color:transparent;color:var(--brand)}
.chip.ok{background:color-mix(in oklab,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}
.chip.warn{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.chip.err{background:color-mix(in oklab,var(--err) 16%,transparent);color:var(--err);border-color:transparent}
.badge{background:var(--err);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:2px 6px;min-width:18px;text-align:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.cat-tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-size:11px;font-weight:600;transition:.15s}
.cat-tile:active{transform:scale(.96)}
.cat-tile:hover{border-color:var(--brand);background:color-mix(in oklab,var(--brand) 5%,transparent)}
.cat-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in oklab,var(--brand) 12%,transparent)}

.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#001016;font-weight:800;flex-shrink:0}
.stars{color:#f5b300;font-size:12px;letter-spacing:1px}

.banner{background:linear-gradient(135deg,var(--navy),#1a2a5c);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.banner h3{margin:0 0 4px;font-size:16px}
.banner p{margin:0;font-size:12px;opacity:.9}
.banner .pill{position:absolute;top:10px;right:10px;background:var(--brand-2);color:#001016;font-size:10px;font-weight:800;padding:4px 8px;border-radius:8px}

/* Modal */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:80;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:80%;overflow-y:auto;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{margin:4px 0 12px;font-size:17px}
.handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 12px}

/* Toast */
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#0b1422;color:#fff;padding:10px 14px;border-radius:12px;font:600 13px 'Plus Jakarta Sans';opacity:0;transition:.3s;z-index:100;max-width:80%;text-align:center;pointer-events:none}
.toast.show{opacity:1;bottom:100px}

.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo svg{width:28px;height:28px}

.list-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.15s}
.list-item:hover{border-color:var(--brand);background:color-mix(in oklab,var(--brand) 4%,transparent)}
.muted{color:var(--muted);font-size:12px}
.price{font-weight:800;color:var(--brand)}
hr.sep{border:none;border-top:1px solid var(--border);margin:10px 0}

.timeline{display:flex;flex-direction:column;gap:14px;position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-22px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--border)}
.tl-item.done::before{background:var(--ok);border-color:var(--ok)}
.tl-item.active::before{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in oklab,var(--brand) 25%,transparent)}

.map{background:linear-gradient(135deg,#a8d8ea,#aab8d8);height:200px;border-radius:14px;position:relative;overflow:hidden;margin-bottom:12px}
[data-theme="dark"] .map{background:linear-gradient(135deg,#13355c,#0a1b34)}
.map .pin{position:absolute;width:24px;height:24px;border-radius:50% 50% 50% 0;background:var(--err);transform:rotate(-45deg);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.map .pin.you{background:var(--brand);left:30%;top:50%}
.map .pin.worker{left:65%;top:30%}
.map-label{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.95);color:#000;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.map-route{position:absolute;left:32%;top:48%;width:38%;height:2px;background:var(--brand);transform-origin:left center;transform:rotate(-18deg)}

.media-tile{aspect-ratio:1;background:var(--surface-2);border:1px dashed var(--border);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:11px;cursor:pointer;transition:.15s}
.media-tile:hover{border-color:var(--brand)}
.media-tile.filled{background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;border-style:solid;border-color:transparent;font-weight:700}

.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.new{background:color-mix(in oklab,var(--brand) 18%,transparent);color:var(--brand)}

/* Toggle switch */
.toggle-wrap{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:6px 12px}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;border-radius:99px;background:var(--border);transition:.25s}
.toggle input:checked+.toggle-slider{background:var(--ok)}
.toggle-slider::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.toggle input:checked+.toggle-slider::before{left:23px}

/* Star rating interactive */
.star-input{font-size:40px;letter-spacing:8px;cursor:pointer;color:#ccc;margin:20px 0}
.star-input .star{transition:.15s;display:inline-block}
.star-input .star.on{color:#f5b300}
.star-input .star:hover{transform:scale(1.2)}

/* Search bar */
.search-bar{position:relative;margin-bottom:12px}
.search-bar .input{padding-left:38px}
.search-bar::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;z-index:1}

/* Progress bar */
.prog-bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:99px;transition:width .5s}

/* Pulsing dot */
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.9)}}
.pulse{animation:pulse 1.5s infinite}

/* Scroll chips */
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}

/* ---- Auth specific ---- */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes logoPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes splashBg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.splash-screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:0;overflow:hidden;background:linear-gradient(145deg,#0a1628 0%,#0e2040 40%,#071520 100%)}
.splash-circles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.splash-circle{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35}
.splash-c1{width:300px;height:300px;background:radial-gradient(circle,#0e9aa7,transparent);top:-80px;right:-60px}
.splash-c2{width:260px;height:260px;background:radial-gradient(circle,#43e3eb,transparent);bottom:100px;left:-80px}
.splash-c3{width:180px;height:180px;background:radial-gradient(circle,#7ed957,transparent);top:40%;left:40%}
.splash-top{text-align:center;padding-top:80px;animation:fadeSlideUp .6s .2s both}
.splash-logo-wrap{width:110px;height:110px;margin:0 auto 20px;background:#0b0b0a;border-radius:28px;overflow:hidden;box-shadow:0 0 0 2.5px rgba(67,227,235,.35),0 0 48px rgba(67,227,235,.2),0 24px 60px rgba(0,0,0,.6);animation:logoPop .7s .1s both}
.splash-title{font-size:40px;font-weight:800;color:#fff;letter-spacing:-1.5px;margin:0}
.splash-title span{color:#43e3eb}
.splash-sub{font-size:13px;font-weight:600;color:rgba(255,255,255,.6);margin:6px 0 0;letter-spacing:.5px}
.splash-mid{display:flex;gap:20px;justify-content:center;animation:fadeSlideUp .6s .35s both}
.splash-stat{text-align:center}
.splash-stat-val{font-size:22px;font-weight:800;color:#43e3eb}
.splash-stat-lbl{font-size:10px;color:rgba(255,255,255,.5);font-weight:600;letter-spacing:.5px}
.splash-bot{width:100%;padding:24px 24px 36px;animation:fadeSlideUp .6s .5s both}
.splash-btn{width:100%;background:linear-gradient(135deg,#0e9aa7,#43e3eb);color:#001016;border:none;border-radius:16px;padding:16px;font:800 16px 'Plus Jakarta Sans';cursor:pointer;box-shadow:0 8px 32px rgba(14,154,167,.4);transition:.2s}
.splash-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(14,154,167,.5)}
.splash-login-link{text-align:center;margin-top:14px;font-size:13px;color:rgba(255,255,255,.5)}
.splash-login-link b{color:#43e3eb;cursor:pointer}

/* Role select cards */
.role-card{background:var(--surface);border:2px solid var(--border);border-radius:18px;padding:16px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.role-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 24px rgba(14,154,167,.15)}
.role-card.selected{border-color:var(--brand);background:color-mix(in oklab,var(--brand) 8%,transparent)}
.role-icon-box{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.role-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex-shrink:0;transition:.2s}
.role-check.on{background:var(--brand);border-color:var(--brand)}

/* OTP method select */
.otp-method{border:2px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:10px;transition:.2s;background:var(--surface)}
.otp-method:hover{border-color:var(--brand)}
.otp-method.selected{border-color:var(--brand);background:color-mix(in oklab,var(--brand) 8%,transparent)}
.otp-method-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}

/* Password input */
.pwd-wrap{position:relative}
.pwd-wrap .input{padding-right:44px}
.pwd-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;color:var(--muted);user-select:none}

/* Step indicator */
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.step-dot{width:8px;height:8px;border-radius:99px;background:var(--border);transition:.3s}
.step-dot.active{width:24px;background:var(--brand)}
.step-dot.done{background:var(--ok)}
</style>
</head>
<body>

<div class="toolbar">
  <div class="group" id="roleSwitcher"></div>
  <button id="themeToggle">🌙 Dark</button>
  <button onclick="goHome()">🏠 Home</button>
</div>

<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>● ● ● 100%</span></div>
  <div id="screens"></div>
  <div id="tabbar" style="position:absolute;bottom:0;left:0;right:0;height:80px;z-index:6;overflow:visible"></div>
  <div class="modal-bg" id="modalBg"><div class="modal" id="modalEl"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   KWICKLY – v4 Fully Interactive Prototype
   ============================================================ */
/* ---- Kwickly Logo — uses actual logo.jpeg image ---- */
/* Small logo for appbars (32x32) */
const LOGO_SVG = `<img src="logo.jpeg" width="100%" height="100%" style="object-fit:cover;border-radius:7px;display:block;" alt="Kwickly" />`;
/* Large logo for splash screen (110x110) */
const LOGO_SVG_LARGE = `<img src="logo.jpeg" width="100%" height="100%" style="object-fit:cover;border-radius:24px;display:block;" alt="Kwickly" />`;



const CATEGORIES = [
  {id:'cleaning',name:'Cleaning',icon:'🧹',subs:['Home Cleaning','Sofa Cleaning','Kitchen Deep Clean','Bathroom Cleaning']},
  {id:'plumbing',name:'Plumbing',icon:'🔧',subs:['Tap Repair','Leak Fix','Drain Cleaning','Bathroom Fitting']},
  {id:'electrical',name:'Electrical',icon:'⚡',subs:['Switch/Socket','Fan Install','Wiring','MCB Issue']},
  {id:'ac',name:'AC & HVAC',icon:'❄️',subs:['AC Service','AC Install','Gas Refill','Repair']},
  {id:'appliance',name:'Appliance',icon:'🔌',subs:['Washing Machine','Refrigerator','Microwave','Geyser']},
  {id:'pest',name:'Pest Control',icon:'🐜',subs:['General','Cockroach','Termite','Bed Bugs']},
  {id:'car',name:'Car Services',icon:'🚗',subs:['Wash','Service','Battery','Tyre']},
  {id:'painting',name:'Painting',icon:'🎨',subs:['Interior','Exterior','Texture','Waterproofing']},
  {id:'carpentry',name:'Carpentry',icon:'🪚',subs:['Furniture Repair','New Furniture','Door Repair','Polish']},
  {id:'beauty',name:'Beauty',icon:'💄',subs:['Salon at Home','Spa','Bridal','Hair']},
  {id:'movers',name:'Packers & Movers',icon:'📦',subs:['Local','Intercity','Office','Storage']},
  {id:'tutor',name:'Home Tuition',icon:'📚',subs:['Primary','High School','Music','Coding']},
];

const WORKERS_SAMPLE = [

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
function toast(msg){
  const t=$('#toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('show'),2000);
}
function openModal(html){
  $('#modalEl').innerHTML='<div class="handle"></div>'+html;
  $('#modalBg').classList.add('show');
}
function closeModal(){$('#modalBg').classList.remove('show')}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});

function go(screen,push=true){
  if(push && state.screen) state.stack.push(state.screen);
  state.screen=screen;
  render();
}
function back(){
  if(state.stack.length){state.screen=state.stack.pop();render()}
}
function goHome(){
  state.stack=[];
  state.screen=rootScreenFor(state.role);
  state.tab='home';
  render();
}
function rootScreenFor(role){
  return {customer:'c_home',worker:'w_home',shop:'sh_home',admin:'a_home'}[role];
}
function setRole(r){
  state.role=r;
  state.stack=[];
  state.screen=rootScreenFor(r);
  state.tab='home';
  renderRoleSwitcher();
  render();
}
function setTheme(t){
  state.theme=t;
  $('#phone').setAttribute('data-theme',t);
  $('#themeToggle').textContent=t==='dark'?'☀️ Light':'🌙 Dark';
}
function navTab(tab,screen){
  state.tab=tab;
  state.stack=[];
  go(screen,false);
}

function appbar(title,sub,opts={}){

function otpNext(el,nextId){
  if(el.value.length>=1){const next=$('#'+nextId);if(next)next.focus();}
}
function verifyRegOTP(){
  const otp=[$('#otp1'),$('#otp2'),$('#otp3'),$('#otp4')].map(i=>i?.value||'').join('');
  if(otp==='4729'){
    toast('✅ Number verified!');
    setTimeout(()=>go('reg_setpwd'),400);
  } else {
    toast('❌ Wrong OTP. Use 4729 for demo');
  }
}

function completeRegistration(){
  const p1=$('#newPwd1')?.value||'';
  const p2=$('#newPwd2')?.value||'';
  if(p1.length<6){toast('Password must be at least 6 characters');return;}
  if(p1!==p2){toast('Passwords do not match');return;}
  state.reg.password=p1;
  // Add user to simulated DB
  state.users.push({
    phone:state.reg.phone,
    name:state.reg.name,
    role:state.reg.role,
    password:p1,
  });
  state.loggedIn=true;
  state.currentUser={phone:state.reg.phone,name:state.reg.name,role:state.reg.role};
  state.role=state.reg.role;
  toast('🎉 Account created! Welcome, '+state.reg.name.split(' ')[0]+'!');
  setTimeout(()=>goHome(),600);
}

function selectTimeSlot(id){
  ['ts_urgent','ts_morning','ts_afternoon','ts_evening'].forEach(tid=>{
    const el=document.getElementById(tid);
    if(!el)return;
    const active=tid===id;
    el.style.borderColor=active?'var(--brand)':'var(--border)';
    el.style.background=active?'color-mix(in oklab,var(--brand) 10%,transparent)':'var(--surface)';
  });
  state.booking.timeSlot=id.replace('ts_','');
}

function submitBooking(){
  const addr=document.getElementById('svcAddr')?.value||'A-12 Sector 21, Delhi';
  const date=document.getElementById('jobDate')?.value||'Today';
  const desc=document.getElementById('jobDesc')?.value||'';
  state.booking.id='BK'+Math.floor(1000+Math.random()*9000);
  state.booking.status='bidding';
  state.booking.address=addr;
  state.booking.date=date;
  state.booking.desc=desc;
  state.bids=[];
  state.acceptedWorker=null;
  toast('Job posted! Notifying nearby pros 📡');
  go('c_bidding');
  const arrival=[800,1600,2500,3500];
  arrival.forEach((d,idx)=>setTimeout(()=>{
    if(idx<WORKERS_SAMPLE.length) state.bids.push(WORKERS_SAMPLE[idx]);
    if(state.screen==='c_bidding') render();
  },d));
}

      onclick="toast('\ud83d\udccd Fetching GPS location...');setTimeout(()=>{document.getElementById('aFull').value='Current Location · Sector 21, Delhi 110085';toast('Location picked \u2713');},1000)">\ud83d\udccd Use Current Location</button>
    <button class="btn" onclick="saveNewAddress()">Save Address</button>
  `);
}
function saveNewAddress(){
  const icon=document.getElementById('aIcon')?.value||'\ud83d\udccd';
  const label=document.getElementById('aLabel')?.value.trim();
  const full=document.getElementById('aFull')?.value.trim();
  if(!label||!full){toast('Please fill all fields');return;}
  state.addresses.push({id:'a'+Date.now(),label,icon,full,primary:false});
  closeModal();toast('Address saved \u2714');render();
}
function editAddress(id){
  const a=state.addresses.find(x=>x.id===id);
  if(!a)return;
  openModal(`
    <h3 style="margin:0 0 14px">Edit Address</h3>
    <label class="muted" style="font-size:11px;font-weight:600">Label</label>
    <input class="input" id="eaLabel" value="${a.label}" style="margin:4px 0 10px"/>
    <label class="muted" style="font-size:11px;font-weight:600">Full Address</label>
    <input class="input" id="eaFull" value="${a.full}" style="margin:4px 0 10px"/>
    <button class="btn secondary" style="width:100%;padding:9px;font-size:12px;margin-bottom:10px"
      onclick="toast('\ud83d\udccd Fetching GPS...');setTimeout(()=>{document.getElementById('eaFull').value='GPS \u00b7 Sector 21, Delhi 110085';toast('Location updated \u2713');},900)">\ud83d\udccd Pick from Map</button>
    <button class="btn" onclick="updateAddress('${id}')">Update Address</button>
  `);
}
function updateAddress(id){
  const a=state.addresses.find(x=>x.id===id);
  if(!a)return;
  a.label=document.getElementById('eaLabel')?.value.trim()||a.label;
  a.full=document.getElementById('eaFull')?.value.trim()||a.full;
  closeModal();toast('Address updated \u2714');render();
}
function deleteAddress(id){
  if(!confirm('Delete this address?'))return;
  state.addresses=state.addresses.filter(a=>a.id!==id);
  if(!state.addresses.some(a=>a.primary)&&state.addresses.length) state.addresses[0].primary=true;
  toast('Address deleted');render();
}
function setPrimaryAddress(id){
  state.addresses.forEach(a=>a.primary=a.id===id);
  toast('Primary address updated \u2714');render();
}

/* ---- Payment CRUD functions ---- */
function addPayment(){
  openModal(`
    <h3 style="margin:0 0 14px">Add Payment Method</h3>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      ${['\ud83d\udcf1 UPI','\ud83d\udcb3 Debit Card','\ud83d\udcb3 Credit Card','\ud83d\udcb5 Cash on Delivery'].map(t=>`<button onclick="document.getElementById('pType').value='${t}'" style="padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-size:11px">${t}</button>`).join('')}

function savePayment(){
  const type=document.getElementById('pType')?.value.trim();

  if(!type||!detail){toast('Please fill all fields');return;}
  const icon=type.toLowerCase().includes('upi')?'\ud83d\udcf1':type.toLowerCase().includes('cash')?'\ud83d\udcb5':'\ud83d\udcb3';
  state.payments.push({id:'p'+Date.now(),type,icon,detail,primary:false});
  closeModal();toast('Payment method added \u2714');render();
}
function deletePayment(id){
  if(!confirm('Remove this payment method?'))return;
  state.payments=state.payments.filter(p=>p.id!==id);
  if(!state.payments.some(p=>p.primary)&&state.payments.length) state.payments[0].primary=true;
  toast('Payment method removed');render();
}
function setPrimaryPayment(id){
  state.payments.forEach(p=>p.primary=p.id===id);
  toast('Default payment updated \u2714');render();
}
function pickProfilePhoto(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{state.profileImg=ev.target.result;render();toast('Photo updated \u2714');};
    r.readAsDataURL(f);
  };
  inp.click();
}
function saveProfile(){
  state.profileName=document.getElementById('epName')?.value.trim()||state.profileName;
  state.profileEmail=document.getElementById('epEmail')?.value.trim()||state.profileEmail;
  toast('Profile saved \u2714');back();
}

screens.sh_order_detail=()=>{
  const order=state.shopOrders.find(o=>o.id===state.activeOrder)||state.shopOrders[0];

  const si=statusFlow.indexOf(order.status);
  const nextStatus=statusFlow[si+1];
  const nextLabel={new:'Start Packing',packing:'Mark Out for Delivery',out:'Mark Delivered',delivered:null}[order.status];
  return `<div class="screen show">
    ${appbar('Order '+order.id,order.customer,{back:true})}
    <div class="body">
      <div class="timeline" style="margin-bottom:16px">
        ${statusFlow.map((s,i)=>`<div class="tl-item ${i<=si?i===si?'active':'done':''}">${['📋 New Order','📦 Packing','🚚 Out for Delivery','✅ Delivered'][i]}</div>`).join('')}
      </div>
      <div class="card">
        <b>Customer</b>
        <div class="row" style="margin-top:8px">
          <div class="avatar">${order.customer[0]}</div>
          <div style="flex:1"><b>${order.customer}</b><div class="muted">Customer</div></div>
          <button class="btn sm secondary" onclick="toast('Calling customer...')">📞</button>
        </div>
      </div>
      <div class="card">
        <b>Items (${order.items})</b>
        ${(order.products||[]).map(p=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${p}</span><span class="price">₹${(Math.random()*300+50).toFixed(0)}</span></div>`).join('')}
        <div class="row" style="justify-content:space-between;margin-top:10px"><b>Total</b><b class="price" style="font-size:18px">₹${order.total}</b></div>
      </div>
      ${nextLabel?`<button class="btn" onclick="updateOrderStatus('${order.id}','${nextStatus}')">${nextLabel} →</button>`:'<div class="chip ok" style="width:100%;justify-content:center;padding:12px">✅ Order Delivered</div>'}
      <button class="btn outline" style="margin-top:8px" onclick="toast('Customer notified')">📲 Notify Customer</button>
    </div>
  </div>`;
};

function updateOrderStatus(id,newStatus){
  const order=state.shopOrders.find(o=>o.id===id);
  if(order){
    order.status=newStatus;
    toast('Order '+id+' → '+newStatus+' ✅');
    render();
  }
}

function addProduct(){

function openEditProductModal(id){
  const p=state.myProducts.find(p=>p.id===id);
  if(!p) return;
  openModal(`
    <h3>Edit: ${p.name}</h3>
    <div style="display:flex;gap:12px;margin-bottom:10px">
      <div id="editProdImgWrap" style="width:60px;height:60px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--brand);display:grid;place-items:center;font-size:28px;cursor:pointer" data-val="${p.img}" onclick="toast('📸 Camera / Gallery opened');setTimeout(()=>{document.getElementById('editProdImgWrap').innerHTML='<span style=\\'font-size:24px\\'>📦</span>';document.getElementById('editProdImgWrap').dataset.val='📦';toast('Image updated ✅');},1000)">${p.img}</div>
      <div style="flex:1">
        <label class="muted" style="font-weight:600">Product Name</label>
        <input class="input" id="editProdName" value="${p.name}" style="margin-top:6px"/>
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:10px">
      <div><label class="muted" style="font-weight:600">Price (₹)</label><input class="input" id="editProdPrice" value="${p.price}" type="number" style="margin-top:4px"/></div>
      <div><label class="muted" style="font-weight:600">Stock</label><input class="input" id="editProdStock" value="${p.stock}" type="number" style="margin-top:4px"/></div>
    </div>
    <button class="btn" onclick="saveProduct('${id}')">Save Changes</button>
    <button class="btn danger" style="margin-top:8px" onclick="confirmDeleteProduct('${id}')">Delete Product</button>
  `);
}

function saveProduct(id){
  const p=state.myProducts.find(p=>p.id===id);
  if(!p) return;
  p.name=$('#editProdName')?.value||p.name;
  p.price=parseInt($('#editProdPrice')?.value||p.price);
  p.stock=parseInt($('#editProdStock')?.value||p.stock);
  p.img=$('#editProdImgWrap')?.dataset.val||p.img;
  closeModal();
  toast('Product updated ✅');
  render();
}

function confirmDeleteProduct(id){
  const p=state.myProducts.find(p=>p.id===id);
  openModal(`
    <h3>Delete Product?</h3>
    <p class="muted">Are you sure you want to delete "${p?.name}"? This cannot be undone.</p>
    <button class="btn danger" onclick="deleteProduct('${id}')">Yes, Delete</button>
    <button class="btn secondary" style="margin-top:8px" onclick="closeModal()">Cancel</button>
  `);
}

function deleteProduct(id){
  state.myProducts=state.myProducts.filter(p=>p.id!==id);
  closeModal();
  toast('Product deleted');
  render();
}

      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
        ${pm.primary?'<span class="chip ok" style="padding:2px 6px">Primary</span>':`<button class="btn sm secondary" onclick="state.shopPayoutMethods.forEach(m=>m.primary=false);state.shopPayoutMethods.find(m=>m.id==='${pm.id}').primary=true;openWithdrawModal()">Set Primary</button>`}
        <button class="btn sm danger" onclick="state.shopPayoutMethods=state.shopPayoutMethods.filter(m=>m.id!=='${pm.id}');openWithdrawModal()">Delete</button>
      </div>
    </div>
  `).join('');

  openModal(`
    <h3 style="margin-bottom:4px">Withdraw Funds</h3>
    <div class="muted" style="font-size:12px;margin-bottom:12px">Select destination account</div>
    <div style="max-height:180px;overflow-y:auto;margin-bottom:10px;border:1px solid var(--border);border-radius:10px">
      ${state.shopPayoutMethods.length===0?'<div class="muted" style="text-align:center;padding:16px">No payout methods</div>':pmHtml}
    </div>
    <button class="btn outline" style="margin-bottom:14px" onclick="toast('Add new payout method flow...')">+ Add Bank or UPI</button>
    <input class="input" placeholder="Amount to withdraw (₹)" type="number" style="margin-bottom:6px"/>
    <div class="muted" style="margin-bottom:12px;font-size:11px">Processing time: 1–2 business days</div>
    <button class="btn" onclick="closeModal();toast('Withdrawal request submitted ✅')">Submit Request</button>
  `);
}

function profileScreen(name,sub,items){
  return `<div class="screen show">
    ${appbar('My Profile','')}
    <div class="body">
      <div class="card" style="text-align:center;padding:20px">
        <div class="avatar" style="width:72px;height:72px;font-size:28px;margin:0 auto 12px">${name[0]}</div>
        <b style="font-size:18px">${name}</b>
        <div class="muted">${sub}</div>
        <div class="row" style="justify-content:center;gap:16px;margin-top:12px">
          <div style="text-align:center"><div style="font-weight:800;color:var(--brand)">48</div><div class="muted" style="font-size:10px">Jobs</div></div>
          <div style="text-align:center"><div style="font-weight:800;color:var(--brand)">★4.8</div><div class="muted" style="font-size:10px">Rating</div></div>
          <div style="text-align:center"><div style="font-weight:800;color:var(--brand)">2yr</div><div class="muted" style="font-size:10px">Member</div></div>
        </div>
        <button class="btn sm secondary" style="margin-top:12px" onclick="openModal('<h3>Edit Profile</h3><input class=input value=\\'${name}\\' style=\\'margin:8px 0\\'/><input class=input value=\\'+91 98765 43210\\' style=\\'margin:8px 0\\'/><input class=input value=\\'user@email.com\\' style=\\'margin:8px 0\\'/><button class=btn onclick=\\'closeModal();toast(\\'Profile updated!\\')\\'>Save Changes</button>')">Edit Profile</button>
      </div>
      ${items.map(item=>`
        <div class="list-item" onclick="${item.action}">
          <span style="font-size:22px">${item.icon}</span>
          <div style="flex:1"><b>${item.t}</b>${item.v?`<div class="muted">${item.v}</div>`:''}</div>
          <span style="color:var(--brand)">›</span>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  closeModal();
  const fn=screens[state.screen]||(()=>`<div class="screen show"><div class="body" style="text-align:center;padding-top:40px"><div style="font-size:48px">🔧</div><p class="muted">Screen "<b>${state.screen}</b>" coming soon</p><button class="btn" onclick="goHome()">Go Home</button></div></div>`);
  $('#screens').innerHTML=fn();
  renderTabbar();
}

renderRoleSwitcher();
setTheme('light');
$('#themeToggle').addEventListener('click',()=>setTheme(state.theme==='dark'?'light':'dark'));
state.screen='splash';
render();
</script>
</body>
</html>
