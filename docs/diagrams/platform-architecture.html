<title>Kwickly — Platform Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#0a0c10; --surface:#141720; --surface2:#1c2030; --border:#252b3b;
    --text:#e2e8f0; --muted:#64748b;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }

  .header { padding:24px 32px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,#0a0c10,#0e1018); }
  .header h1 { font-size:22px; font-weight:700; background:linear-gradient(90deg,#f59e0b,#f97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .header p { color:var(--muted); font-size:13px; margin-top:4px; }
  .badge { display:inline-flex; align-items:center; padding:5px 12px; border-radius:20px; font-size:11px; font-weight:600; font-family:'JetBrains Mono',monospace; }
  .badge-amber { background:#451a03; color:#fde68a; border:1px solid #78350f; }

  .diagram-container { padding:30px; overflow:auto; }
  svg.diagram { display:block; margin:0 auto; }

  @keyframes flow-dash { to { stroke-dashoffset: -20; } }
  .flow-line { stroke-dasharray: 6,4; animation: flow-dash 1.5s linear infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .pulse-dot { animation: pulse 2s ease-in-out infinite; }

  .legend { display:flex; gap:20px; flex-wrap:wrap; padding:14px 32px; background:var(--surface); border-bottom:1px solid var(--border); }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .legend-dot { width:10px; height:10px; border-radius:2px; }
  .legend-line { width:28px; height:2px; }
</style>
</head>
